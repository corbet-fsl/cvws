[package]
name = "cvws"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "CareerVector storage workspace: document envelope, Store trait, conditional writes, receipts, cvfs and cvdb backends"
license = "FSL-1.1-ALv2"
readme = "README.md"
repository = "https://git.corbet.ch/corbet-fsl/cvws"
keywords = ["storage", "crdt", "yjs", "cv"]
categories = ["data-structures"]

[dependencies]
cvfs = { git = "https://git.corbet.ch/corbet-fsl/cvfs.git", branch = "main" }
cvdb = { git = "https://git.corbet.ch/corbet-fsl/cvdb.git", branch = "main", default-features = false, features = ["sqlite"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
cvdb = { git = "https://git.corbet.ch/corbet-fsl/cvdb.git", branch = "main", features = ["fake-server"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
